local_events = yes
write_logs = yes
log_file = /out/audit.log
log_group = root
log_format = RAW
flush = INCREMENTAL_ASYNC
freq = 1
max_log_file = 1024
num_logs = 1
priority_boost = 4
name_format = NONE
max_log_file_action = KEEP_LOGS
space_left = 256
space_left_action = SUSPEND
admin_space_left = 128
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SUSPEND
use_libwrap = no
q_depth = 65536
overflow_action = SUSPEND
max_restarts = 10
plugin_dir = /etc/audit/plugins.d
end_of_event_timeout = 2
