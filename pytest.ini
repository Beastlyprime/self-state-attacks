[pytest]
# The import roots the experiment code expects on sys.path: the repository
# itself (for `experiments.code.*`), the code tree (for `measurement.*`,
# `dataset_builder.*`, ...), the agent tree (for `openclaw_core.*`), and
# `experiments/` (for `tasks.*`).
pythonpath = . experiments/code experiments/agent experiments
testpaths = experiments/code experiments/agent
# importlib mode keeps the several same-named `tests/` directories from
# colliding on a single top-level `tests` package.
addopts = --import-mode=importlib
